<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MovieMind - Get smart movie recommendations powered by machine learning">
    <meta name="theme-color" content="#e50914">
    <meta name="color-scheme" content="dark light">
    <title>Sign Up - MovieMind</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 120px auto 40px;
            padding: 30px;
            border-radius: var(--border-radius);
            background-color: var(--light-card-bg);
            box-shadow: 0 8px 30px var(--light-shadow);
            transition: background-color var(--transition-speed), box-shadow var(--transition-speed);
        }
        
        .dark-mode .auth-container {
            background-color: var(--dark-card-bg);
            box-shadow: 0 8px 30px var(--dark-shadow);
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .auth-title {
            font-size: 2rem;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .form-floating input {
            border-radius: var(--button-border-radius);
            border: 1px solid var(--light-border);
            transition: all var(--transition-speed);
        }
        
        .dark-mode .form-floating input {
            background-color: var(--dark-card-hover);
            border-color: var(--dark-border);
            color: var(--dark-text);
        }
        
        .dark-mode .form-floating label {
            color: var(--dark-secondary-text);
        }
        
        .form-floating input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(229, 9, 20, 0.25);
        }
        
        .auth-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--button-border-radius);
            padding: 12px;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
            transition: all var(--transition-speed);
        }
        
        .auth-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(229, 9, 20, 0.3);
        }
        
        .auth-links {
            margin-top: 25px;
            text-align: center;
        }
        
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all var(--transition-speed);
        }
        
        .auth-links a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .auth-error {
            background-color: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff0000;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border-radius: var(--border-radius);
            animation: fadeIn 0.5s ease-in-out;
            display: none;
        }
        
        .auth-error i {
            color: #ff0000;
            font-size: 1.2rem;
            margin-right: 10px;
        }
        
        .auth-success {
            background-color: rgba(40, 167, 69, 0.1);
            border-left: 4px solid #28a745;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border-radius: var(--border-radius);
            animation: fadeIn 0.5s ease-in-out;
            display: none;
        }
        
        .auth-success i {
            color: #28a745;
            font-size: 1.2rem;
            margin-right: 10px;
        }
    </style>
</head>
<body class="dark-mode">
    <header>
        <div class="logo">
            <span class="logo-text">MovieMind</span>
            <span class="logo-tagline">Smart Recommendations</span>
        </div>
        <div class="theme-toggle">
            <button id="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle theme">
                <i class="fas fa-sun" aria-hidden="true"></i>
                <i class="fas fa-moon" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fas fa-user-plus" style="font-size: 3rem; color: var(--primary-color);"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            
            <div id="signup-error" class="auth-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-message">Error message</span>
            </div>
            
            <div id="signup-success" class="auth-success">
                <i class="fas fa-check-circle"></i>
                <span>Account created successfully! Redirecting to login...</span>
            </div>
            
            <form id="signup-form">
                <div class="form-floating">
                    <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                    <label for="name">Full Name</label>
                </div>
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required minlength="6">
                    <label for="password">Password</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="confirm-password" placeholder="Confirm Password" required minlength="6">
                    <label for="confirm-password">Confirm Password</label>
                </div>
                
                <button type="submit" class="auth-btn">Sign Up</button>
                
                <div class="auth-links">
                    <a href="/login">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>MovieMind &copy; 2025 | Powered by Machine Learning</p>
            <p class="ml-info">Using K-Nearest Neighbors (KNN) algorithm for smart recommendations</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Check if user is already logged in
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = '/';
            }
            
            // Handle signup form submission
            const signupForm = document.getElementById('signup-form');
            const signupError = document.getElementById('signup-error');
            const signupSuccess = document.getElementById('signup-success');
            const errorMessage = document.getElementById('error-message');
            
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // Validate passwords match
                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords do not match';
                    signupError.style.display = 'flex';
                    return;
                }
                
                // Get existing users from local storage
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Check if email already exists
                if (users.some(user => user.email === email)) {
                    errorMessage.textContent = 'Email already registered';
                    signupError.style.display = 'flex';
                    return;
                }
                
                // Add new user
                users.push({
                    name,
                    email,
                    password
                });
                
                // Save updated users to local storage
                localStorage.setItem('users', JSON.stringify(users));
                
                // Show success message
                signupError.style.display = 'none';
                signupSuccess.style.display = 'flex';
                
                // Clear form
                signupForm.reset();
                
                // Redirect to login page after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            });
        });
    </script>
</body>
</html>
