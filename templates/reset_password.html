<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MovieMind - Get smart movie recommendations powered by machine learning">
    <meta name="theme-color" content="#e50914">
    <meta name="color-scheme" content="dark light">
    <title>Reset Password - MovieMind</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 120px auto 40px;
            padding: 30px;
            border-radius: var(--border-radius);
            background-color: var(--light-card-bg);
            box-shadow: 0 8px 30px var(--light-shadow);
            transition: background-color var(--transition-speed), box-shadow var(--transition-speed);
        }
        
        .dark-mode .auth-container {
            background-color: var(--dark-card-bg);
            box-shadow: 0 8px 30px var(--dark-shadow);
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .auth-title {
            font-size: 2rem;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        
        .auth-subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: var(--light-secondary-text);
        }
        
        .dark-mode .auth-subtitle {
            color: var(--dark-secondary-text);
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .form-floating input {
            border-radius: var(--button-border-radius);
            border: 1px solid var(--light-border);
            transition: all var(--transition-speed);
        }
        
        .dark-mode .form-floating input {
            background-color: var(--dark-card-hover);
            border-color: var(--dark-border);
            color: var(--dark-text);
        }
        
        .dark-mode .form-floating label {
            color: var(--dark-secondary-text);
        }
        
        .form-floating input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(229, 9, 20, 0.25);
        }
        
        .auth-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--button-border-radius);
            padding: 12px;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
            transition: all var(--transition-speed);
        }
        
        .auth-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(229, 9, 20, 0.3);
        }
        
        .auth-links {
            margin-top: 25px;
            text-align: center;
        }
        
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all var(--transition-speed);
        }
        
        .auth-links a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .auth-error {
            background-color: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff0000;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border-radius: var(--border-radius);
            animation: fadeIn 0.5s ease-in-out;
            display: none;
        }
        
        .auth-error i {
            color: #ff0000;
            font-size: 1.2rem;
            margin-right: 10px;
        }
        
        .auth-success {
            background-color: rgba(40, 167, 69, 0.1);
            border-left: 4px solid #28a745;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border-radius: var(--border-radius);
            animation: fadeIn 0.5s ease-in-out;
            display: none;
        }
        
        .auth-success i {
            color: #28a745;
            font-size: 1.2rem;
            margin-right: 10px;
        }
    </style>
</head>
<body class="dark-mode">
    <header>
        <div class="logo">
            <span class="logo-text">MovieMind</span>
            <span class="logo-tagline">Smart Recommendations</span>
        </div>
        <div class="theme-toggle">
            <button id="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle theme">
                <i class="fas fa-sun" aria-hidden="true"></i>
                <i class="fas fa-moon" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fas fa-lock" style="font-size: 3rem; color: var(--primary-color);"></i>
            </div>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Create a new password for your account.</p>
            
            <div id="reset-error" class="auth-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-message">Error message</span>
            </div>
            
            <div id="reset-success" class="auth-success">
                <i class="fas fa-check-circle"></i>
                <span>Password reset successful! Redirecting to login...</span>
            </div>
            
            <form id="reset-form">
                <input type="hidden" id="email" name="email">
                <input type="hidden" id="token" name="token">
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="New Password" required minlength="6">
                    <label for="password">New Password</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="confirm-password" placeholder="Confirm Password" required minlength="6">
                    <label for="confirm-password">Confirm Password</label>
                </div>
                
                <button type="submit" class="auth-btn">Reset Password</button>
                
                <div class="auth-links">
                    <a href="/login">Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>MovieMind &copy; 2025 | Powered by Machine Learning</p>
            <p class="ml-info">Using K-Nearest Neighbors (KNN) algorithm for smart recommendations</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const token = urlParams.get('token');
            
            // Set hidden fields
            document.getElementById('email').value = email || '';
            document.getElementById('token').value = token || '';
            
            // Check if token is valid
            const resetRequests = JSON.parse(localStorage.getItem('resetRequests')) || {};
            const resetRequest = resetRequests[email];
            
            const resetError = document.getElementById('reset-error');
            const errorMessage = document.getElementById('error-message');
            
            // Validate token and expiry
            if (!email || !token || !resetRequest || resetRequest.token !== token || resetRequest.expires < Date.now()) {
                errorMessage.textContent = 'Invalid or expired reset link. Please request a new password reset.';
                resetError.style.display = 'flex';
                document.getElementById('reset-form').style.display = 'none';
                return;
            }
            
            // Handle reset form submission
            const resetForm = document.getElementById('reset-form');
            const resetSuccess = document.getElementById('reset-success');
            
            resetForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // Validate passwords match
                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords do not match';
                    resetError.style.display = 'flex';
                    return;
                }
                
                // Get users from local storage
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // Find user with matching email
                const userIndex = users.findIndex(u => u.email === email);
                
                if (userIndex === -1) {
                    errorMessage.textContent = 'User not found';
                    resetError.style.display = 'flex';
                    return;
                }
                
                // Update user's password
                users[userIndex].password = password;
                
                // Save updated users to local storage
                localStorage.setItem('users', JSON.stringify(users));
                
                // Remove reset request
                delete resetRequests[email];
                localStorage.setItem('resetRequests', JSON.stringify(resetRequests));
                
                // Show success message
                resetError.style.display = 'none';
                resetSuccess.style.display = 'flex';
                
                // Clear form
                resetForm.reset();
                
                // Redirect to login page after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            });
        });
    </script>
</body>
</html>
